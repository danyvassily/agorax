name: Online multiplayer hardening

on:
  push:
    branches:
      - fix/online-multiplayer-sync
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/online-multiplayer-sync
          fetch-depth: 0

      - name: Apply targeted multiplayer patches
        if: github.actor != 'github-actions[bot]'
        run: python scripts/apply-online-multiplayer-fix.py

      - name: Commit patched sources
        if: github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/online/room.ts src/components/game/online-room.tsx
          git commit -m "fix(multiplayer): synchronize online game state"
          git push origin HEAD:fix/online-multiplayer-sync

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-key-for-build-only
        run: npm run build
